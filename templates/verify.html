<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REDIRECT | VERIFICATION</title>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #0d0d0d; color: #ffffff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .card { background: #161616; border: 1px solid #282828; border-radius: 16px; padding: 24px; width: 100%; max-width: 380px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
        .badge { display: inline-block; background: #1e293b; color: #38bdf8; font-size: 11px; font-weight: 700; padding: 4px 8px; border-radius: 6px; letter-spacing: 0.5px; margin-bottom: 12px; }
        .badge.success { background: #14532d; color: #4ade80; }
        h2 { font-size: 18px; margin-bottom: 6px; }
        p { font-size: 13px; color: #a1a1aa; margin-bottom: 20px; }
        .cf-container { display: flex; justify-content: center; margin-bottom: 15px; }
        .status-box { background: #000; border: 1px solid #222; border-radius: 10px; padding: 12px; text-align: center; font-size: 14px; margin-top: 10px; display: none; }
        .timer { font-size: 20px; font-weight: bold; color: #38bdf8; }
    </style>
</head>
<body>

<div class="card">
    <div id="badge" class="badge">ACTION REQUIRED</div>
    <h2 id="title">Verify Connection</h2>
    <p id="desc">Please verify your session to access the destination link securely.</p>

    <!-- Cloudflare Turnstile Widget -->
    <div class="cf-container">
        <div class="cf-turnstile" data-sitekey="{{ site_key }}" data-callback="onTurnstileSuccess"></div>
    </div>

    <!-- Redirect Status Box -->
    <div id="status-box" class="status-box">
        <div class="badge success">PAYLOAD VERIFIED</div>
        <p style="margin-top: 5px; color:#fff;">Access Granted</p>
        <p>Redirecting in <span id="timer" class="timer">2</span>s...</p>
    </div>
</div>

<script>
    const destUrl = "{{ dest }}";

    function onTurnstileSuccess(token) {
        document.getElementById('badge').className = "badge success";
        document.getElementById('badge').innerText = "VERIFYING...";
        
        // Backend API verification
        fetch('/api/verify', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ cf_token: token, dest: destUrl })
        })
        .then(res => res.json())
        .then(data => {
            if(data.success) {
                document.getElementById('status-box').style.display = "block";
                document.querySelector('.cf-container').style.display = "none";
                
                let count = 2;
                const timerElem = document.getElementById('timer');
                const interval = setInterval(() => {
                    count--;
                    timerElem.innerText = count;
                    if(count <= 0) {
                        clearInterval(interval);
                        window.location.href = data.redirect_url;
                    }
                }, 1000);
            } else {
                alert("Captcha verification failed. Please refresh.");
            }
        });
    }
</script>

</body>
</html>
